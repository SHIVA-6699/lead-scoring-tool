<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Scoring Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:,">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white">
    <div class="max-w-5xl mx-auto px-6 py-5">
      <h1 class="text-xl font-semibold">Lead Scoring Tool</h1>
      <p class="text-slate-300 text-sm mt-1">Paste company websites, get them ranked by how sales-ready they are.</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-8 space-y-6">
    <section class="bg-white rounded-xl border border-slate-200 p-6">
      <label for="domains" class="block text-sm font-medium text-slate-700 mb-2">Company websites (one per line)</label>
      <textarea id="domains" rows="5" placeholder="stripe.com&#10;notion.so&#10;figma.com"
        class="w-full rounded-lg border border-slate-300 p-3 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800"></textarea>
      <div class="flex items-center gap-3 mt-4">
        <button id="analyzeBtn" class="bg-slate-900 text-white text-sm font-medium px-4 py-2 rounded-lg hover:bg-slate-700">
          Analyze leads
        </button>
        <button id="demoBtn" class="text-sm font-medium px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-100">
          Try demo leads
        </button>
        <a id="exportBtn" href="/api/export" class="text-sm font-medium px-4 py-2 rounded-lg border border-slate-300 hover:bg-slate-100">
          Export CSV
        </a>
        <span id="status" class="text-sm text-slate-500"></span>
      </div>
    </section>

    <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-100 text-slate-600 text-left">
          <tr>
            <th class="px-4 py-3">Company</th>
            <th class="px-4 py-3">Score</th>
            <th class="px-4 py-3">Why</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
      <p id="emptyState" class="text-center text-slate-400 text-sm py-10">No leads yet. Paste some websites above and click Analyze.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
