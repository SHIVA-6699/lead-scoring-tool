<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Scoring Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:,">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div>
        <h1>Lead Scoring</h1>
        <p>Paste company websites. Get them ranked by how sales-ready they are, with the reason for every score.</p>
      </div>
    </header>

    <section class="input-strip">
      <label for="domains">Company websites, one per line</label>
      <textarea id="domains" placeholder="stripe.com&#10;notion.so&#10;figma.com"></textarea>
      <div class="input-actions">
        <button id="analyzeBtn" class="btn btn-primary">Scan leads</button>
        <button id="demoBtn" class="btn btn-secondary" type="button">Try demo leads</button>
        <a id="exportBtn" href="/api/export" class="btn btn-secondary" aria-disabled="true">Export CSV</a>
        <span id="status" class="status-line"></span>
      </div>
    </section>

    <section id="signals" class="signals" hidden>
      <button class="signal-tab is-active" data-bucket="all" type="button">
        <span class="count" id="countAll">0</span>
        <span class="label">all leads</span>
      </button>
      <button class="signal-tab" data-bucket="hot" type="button">
        <span class="count" id="countHot">0</span>
        <span class="label">hot</span>
      </button>
      <button class="signal-tab" data-bucket="warm" type="button">
        <span class="count" id="countWarm">0</span>
        <span class="label">warm</span>
      </button>
      <button class="signal-tab" data-bucket="cold" type="button">
        <span class="count" id="countCold">0</span>
        <span class="label">cold</span>
      </button>
    </section>

    <div class="ledger-head">
      <span class="count-label" id="ledgerCountLabel"></span>
      <select id="sortSelect" class="sort-select" aria-label="Sort leads">
        <option value="score">Sort: score, high to low</option>
        <option value="name">Sort: company name</option>
      </select>
    </div>

    <section id="ledger" class="ledger" hidden></section>

    <div id="emptyState" class="empty-state">
      <strong>No leads scanned yet</strong>
      Paste a list of company websites above, or click "Try demo leads" to see it in action.
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
